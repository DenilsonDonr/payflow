[project]
name = "payflow"
version = "0.1.0"
description = "A payment-processing backend built as a modular monolith — a learning project focused on clean architecture."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
strict = true
# auto: every `async def` test and fixture runs on an event loop without a per-test marker.
asyncio_mode = "auto"
markers = [
    "integration: requires external services (e.g. a running Postgres) to be up",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic owns env.py and migration scripts; they are generated code and require
# imports after runtime configuration, which conflicts with linting them.
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["app", "main"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.pyright]
include = ["app", "main.py"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.1",
]
